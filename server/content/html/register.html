<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Atelier - Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fontsource.org/files/playfair-display/latin-400.css" />
    <link rel="stylesheet" href="https://fontsource.org/files/playfair-display/latin-700.css" />
    <link rel="stylesheet" href="https://fontsource.org/files/lato/latin-400.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Lato"', 'sans-serif'],
                    },
                    colors: {
                        'art-black': '#1a1a1a',
                        'art-gold': '#c5a059',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Lato', sans-serif; background-color: #fafafa; }
    </style>
</head>
<body class="text-art-black antialiased flex flex-col min-h-screen">

<nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-20">
            <a href="../../index.html" class="flex items-center">
                <span class="text-2xl font-bold tracking-widest" style="font-family:'Playfair Display',serif">L'ATELIER</span>
            </a>
            <div class="flex items-center space-x-8">
                <a href="../../index.html" class="text-sm uppercase tracking-widest hover:text-art-gold transition-colors">Galerie</a>
            </div>
        </div>
    </div>
</nav>

<main class="flex-grow flex items-center justify-center bg-gray-50 py-12 px-4">
    <div class="max-w-md w-full space-y-8 bg-white p-10 shadow-lg rounded-sm border-t-4 border-art-gold">
        <div class="text-center">
            <h2 class="mt-2 text-3xl font-bold text-gray-900" style="font-family:'Playfair Display',serif">Créer un compte</h2>
            <p class="mt-2 text-sm text-gray-600">Rejoignez notre cercle privé</p>
        </div>
        <form class="mt-8 space-y-6" id="register-form">
            <div class="space-y-4">
                <div>
                    <label for="name" class="sr-only">Nom complet</label>
                    <input id="name" name="name" type="text" required
                        class="appearance-none block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-art-gold focus:border-art-gold sm:text-sm"
                        placeholder="Nom complet">
                </div>
                <div>
                    <label for="email" class="sr-only">Adresse email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required
                        class="appearance-none block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-art-gold focus:border-art-gold sm:text-sm"
                        placeholder="Adresse email">
                </div>
                <div>
                    <label for="password" class="sr-only">Mot de passe</label>
                    <input id="password" name="password" type="password" required
                        class="appearance-none block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-art-gold focus:border-art-gold sm:text-sm"
                        placeholder="Mot de passe">
                </div>
            </div>
            <div id="error-msg" class="hidden text-red-500 text-sm text-center"></div>
            <button type="submit"
                class="w-full flex justify-center py-3 px-4 text-sm font-medium text-white bg-art-black hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-art-gold transition-colors">
                S'inscrire
            </button>
            <div class="text-center">
                <a href="login.html" class="text-sm text-art-gold hover:text-art-black hover:underline">
                    Déjà un compte ? Se connecter
                </a>
            </div>
        </form>
    </div>
</main>

<footer class="bg-art-black text-white py-12 mt-auto">
    <div class="max-w-7xl mx-auto px-4 text-center">
        <h3 class="text-xl mb-4" style="font-family:'Playfair Display',serif">L'ATELIER</h3>
        <p class="text-gray-400 text-sm">Art contemporain & Classique</p>
        <div class="mt-8 text-xs text-gray-600">&copy; 2023 L'Atelier Galerie. Tous droits réservés.</div>
    </div>
</footer>

<script>
    document.getElementById('register-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');

        if (!name || !email || !password) {
            errorMsg.textContent = 'Veuillez remplir tous les champs.';
            errorMsg.classList.remove('hidden');
            return;
        }

        const user = { name, email };
        localStorage.setItem('user', JSON.stringify(user));
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
